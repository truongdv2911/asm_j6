<div class="box container">
  <h3 class="text-center my-4">Chi tiết sản phẩm</h3>
  <div class="row product-detail">
    <!-- Ảnh phụ -->
    <div class="listImages col-12 col-md-2 mb-3 mb-md-0">
      <img *ngFor="let img of imgs" [src]="img" class="img-thumbnail mb-2 w-100" (click)="changeImg(img)">
    </div>

    <!-- Ảnh chính -->
    <div class="thumbnail col-12 col-md-5 text-center mb-3 mb-md-0">
      <img [src]="detailProduct.url" class="main-image img-fluid">
    </div>

    <!-- Thông tin chi tiết -->
    <div class="title col-12 col-md-5">
      <h3 class="card-title">{{ detailProduct.name }}</h3>
      <p class="card-text">{{ detailProduct.price | pipe }}</p>

      <form>
        <!-- Số lượng -->
        <div class="so_luong mb-3 d-flex align-items-center gap-2">
          <button type="button" class="btn btn-outline-secondary" (click)="decreaseQuality()">-</button>
          <input type="number" [value]="quantity" [(ngModel)]="quantity" min="1" class="form-control w-25 text-center">
          <button type="button" class="btn btn-outline-secondary" (click)="increaseQuality()">+</button>
        </div>

        <!-- Dung tích -->
        <div class="dungTich mb-3">
          <label class="form-label">Dung tích:</label><br>
          <div class="form-check form-check-inline">
            <input type="radio" class="form-check-input" name="dungTich" id="100ml" checked>
            <label class="form-check-label" for="100ml">100ML</label>
          </div>
          <div class="form-check form-check-inline">
            <input type="radio" class="form-check-input" name="dungTich" id="50ml">
            <label class="form-check-label" for="50ml">50ML</label>
          </div>
          <div class="form-check form-check-inline">
            <input type="radio" class="form-check-input" name="dungTich" id="10ml">
            <label class="form-check-label" for="10ml">10ML</label>
          </div>
        </div>

        <button class="btn btn-primary mt-3" (click)="handleAddToCart()">Thêm vào giỏ hàng</button>
      </form>
    </div>
  </div>
  <div class="description">
    <h4 class="mt-4">Mô tả sản phẩm</h4>
    <p>{{ detailProduct.description }}</p>
  </div>
</div>
