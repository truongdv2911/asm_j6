<div class="container mt-4">
    <h4 class="mb-3">Chi tiết sản phẩm trong đơn hàng</h4>
    <table class="table table-hover table-bordered shadow-sm">
      <thead class="table-primary text-center">
        <tr>
          <th>ID</th>
            <th>Hình ảnh</th>
          <th>Tên sản phẩm</th>
          <th>Đơn giá</th>
          <th>Số lượng</th>
          <th>Thành tiền</th>
        </tr>
      </thead>
      <tbody class="text-center align-middle">
        <tr *ngFor="let item of orderDetail; let i = index">
          <td>{{ item.id }}</td>
            <td><img [src]="products[i].url" alt="Product Image" class="img-fluid" style="width: 50px; height: 50px;"></td>
          <td>{{ products[i].name }}</td>
          <td>{{ item.price | pipe }}₫</td>
          <td>{{ item.quantity }}</td>
          <td class="fw-bold text-success">{{ item.total | pipe }}₫</td>
        </tr>
      </tbody>
    </table>
  </div>
