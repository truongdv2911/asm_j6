<div class="group-header shadow-sm">
    <nav class="navbar navbar-expand-lg navbar-dark py-3 shadow">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <img src="assets/img/vuahanghieu.svg" alt="logo" class="img-fluid rounded" style="height: 40px;" />
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#collapsibleNavId"
                aria-controls="collapsibleNavId"
                aria-expanded="false"
                aria-label="Toggle navigation"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="collapsibleNavId">
                <div class="d-flex w-100 justify-content-between align-items-center">
                    <ul class="navbar-nav mb-2 mb-lg-0">
                        <li class="nav-item mx-3">
                            <a class="nav-link active fw-bold" [routerLink]="['/']">Trang chủ</a>
                        </li>
                        <li class="nav-item mx-3">
                            <a class="nav-link fw-bold" [routerLink]="['products']">Sản Phẩm</a>
                        </li>
                        <li class="nav-item mx-3">
                            <a class="nav-link fw-bold" routerLink="/addProduct">Giới thiệu / Liên hệ</a>
                        </li>
                    </ul>

                    <div class="d-flex w align-items-center">
                        <form class="d-flex align-items-center me-3" >
                            <input
                                class="form-control me-2"
                                type="text"
                                placeholder="Tìm kiếm sản phẩm..."
                                name="keyword"
                            />
                            <button class="btn btn-outline-light">Tìm</button>
                        </form>

                        <div class="nav-item ml-3">
                            <ng-container *ngIf="!userResponse">
                                <a class="text-white text-decoration-none d-flex align-items-center me-3" [routerLink]="['loginform']">
                                    <img src="assets/img/1564534_customer_man_user_account_profile_icon.png" width="28" class="me-1" />
                                    Đăng nhập
                                </a>
                            </ng-container>
                            <ng-container *ngIf="userResponse">
                                <div class="position-relative"> <a
                                    class="text-white text-decoration-none d-flex align-items-center me-3"
                                    (click)="toggleDropdown()" style="cursor: pointer;" >
                                    <img
                                      src="assets/img/1564534_customer_man_user_account_profile_icon.png"
                                      width="28"
                                      class="me-1"
                                    />
                                    {{ userResponse.full_name }}
                                  </a>
                              
                                  <div *ngIf="isDropdownOpen" class="position-absolute bg-white shadow rounded mt-2" style="min-width: 150px; z-index: 1000;">
                                    <a class="dropdown-item text-decoration-none text-dark p-2 d-block" [routerLink]="['/profile']">
                                      <i class="bi bi-person me-2"></i> Profile
                                    </a>
                                    <a class="dropdown-item text-decoration-none text-dark p-2 d-block" [routerLink]="['/orders']">
                                      <i class="bi bi-box-seam me-2"></i> Đơn hàng
                                    </a>
                                    <button class="dropdown-item text-decoration-none text-danger p-2 d-block" (click)="logout()">
                                      <i class="bi bi-box-arrow-right me-2"></i> Đăng xuất
                                    </button>
                                  </div>
                                </div>
                              </ng-container>
                        </div>

                        <a class="text-white text-decoration-none d-flex align-items-center ml-3" [routerLink]="['cart']">
                            <img src="assets/img/bxl-shopify.svg" width="32" class="me-1" />
                            Giỏ hàng
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </nav>
</div>
